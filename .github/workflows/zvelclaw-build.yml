name: Zvelclaw Build

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "codex/**"
      - "zvelclaw/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to verify"
        required: true
        default: "main"

concurrency:
  group: zvelclaw-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Production build
        run: pnpm build
